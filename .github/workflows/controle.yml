name: Website controleren

on:
  push:
    branches: [gh-pages]
  workflow_dispatch:

permissions:
  contents: write
  pages: read

jobs:
  controleren:
    runs-on: ubuntu-latest
    steps:
      - name: Status opvragen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 90
          {
            echo "pages-api:"; gh api repos/${{ github.repository }}/pages 2>&1 | head -c 800; echo
            echo "builds:"; gh api repos/${{ github.repository }}/pages/builds/latest 2>&1 | head -c 600; echo
            U="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
            echo "url: $U"
            echo "http: $(curl -s -o /dev/null -w '%{http_code}' "$U")"
          } > status.txt 2>&1
          cat status.txt
          mkdir uit && cp status.txt uit/ && cd uit
          git init -q -b status
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm status
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" status
